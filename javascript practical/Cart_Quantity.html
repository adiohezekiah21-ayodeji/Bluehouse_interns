<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Quantity</title>
</head>
<body>
    
    <h2>
        Shopping Cart
    </h2>

    <button 
    onclick="console.log(`Cart Quantity: ${cartQuantity}`)"
    >
       Show Quantity
    </button>

    <button
    onclick="
    cartQuantity++;
    console.log(`Cart Quantity: ${cartQuantity}`)
    "
    >
        Add to Cart
    </button>

    <button 
    onclick="
    cartQuantity += 2;
    console.log(`Cart Quantity: ${cartQuantity}`)
    "
    >
        +2
    </button>

    <button
    onclick="
    cartQuantity += 3;
    console.log(`Cart Quantity: ${cartQuantity}`)
    "
    >
        +3
    </button>

    <button
    onclick="
    cartQuantity += 4;
    console.log(`Cart Quantity: ${cartQuantity}`)
    "
    >
        +4
    </button>

    <button
    onclick="
    cartQuantity += 5;
    console.log(`Cart Quantity: ${cartQuantity}`)
    "
    >
        +5
    </button>

    

    <button 
    onclick="
    console.log('You have removed a product! Are you sure you want to do this?');
    cartQuantity -= 1;
    console.log(`Cart Quantity: ${cartQuantity}`)
    "
    >
       Remove from Cart
    </button>

    <button 
    onclick="
    console.log('You have removed two products! Are you sure you want to do this?');
    cartQuantity -= 2;
    console.log(`Cart Quantity: ${cartQuantity}`);
    "
    >
        -2
    </button>

    <button
    onclick="
    console.log('You have removed three products! Are you sure you want to do this?')
    cartQuantity -= 3;
    console.log(`Cart Quantity: ${cartQuantity}`)
    "
    >
        -3
    </button>

    <button
    onclick="
    alert('Cart was reset!');
    cartQuantity = 0;
    console.log(`Cart Quantity: ${cartQuantity}`);
    "
    >
        Reset Cart
    </button>

    <script>

        let cartQuantity = 0;

    </script>
</body>
</html>
